schema_version: "1.0"

bundle:
  id: "specassay"
  name: "SpecAssay"
  version: "0.4.6"
  role: "developer"
  description: "Durable-ID promotion for stock Spec Kit: templates, Gate 2 refusal, and trace-manifest emission."
  author: "Rik Dryfoos"
  license: "MIT"
  homepage: "https://github.com/rdryfoos/specassay"
  repository: "https://github.com/rdryfoos/specassay"

requires:
  speckit_version: ">=0.14.0"
  tools: []
  mcp: []

provides:
  presets:
    - id: "specassay"
      version: "0.4.6"
      priority: 10
      strategy: "append"
  extensions:
    - id: "specassay-check"
      version: "0.4.6"

tags:
  - "traceability"
  - "governance"
  - "durable-ids"
  - "gate"
  - "sdd"
