# SpecAssay Check (Gate 2) config for the specassay repo's own registry.
# Founded 2026-08-18 by the docs room (design-room ruling): the tool now
# dogfoods itself. Scoped as founding, not backfill — see PRD.md's intro
# and specs/backlog/tasks.md for why every row opens as backlog.

# Authoritative ID registry
registry: "PRD.md"

# Display name in the emitted trace-manifest
target_name: "specassay"

# Where the check writes the trace-manifest (relative to the project root)
manifest_path: "trace-manifest.json"

# Spec Kit feature artifacts (globs relative to project root)
specs: "specs/**/spec.md"
tasks: "specs/**/tasks.md"

# What "source" means for this repo's own registry: the extension/preset
# code the tool ships. docs/** is deliberately excluded for now, not
# forgotten: docs/testing/*.md quotes real @covers lines from other
# projects' trials as teaching examples (AC-HOME-*, AC-FIX-01, etc.), and
# unlike the spec/task orphan checks, orphan-covers has no domain-scoping
# to tell a citation apart from a real local claim -- scanning docs/**
# here fails the Gate on prose, not drift. Logged to the docs-gaps list
# (2026-08-18) rather than silently special-cased; revisit once FR-DOCS-10
# writes doc files that need to carry real @covers marks of their own.
src_globs:
  - "extensions/**"
  - "presets/**"

# No automated test suite proves this repo's own behavior yet (its own
# changes are verified by hand against real scratch fixtures, per
# CHANGELOG.md). Left pointed at the conventional location so it's not
# silently omitted once one exists.
test_globs:
  - "tests/**"

# ID grammar (HomesFlow-compatible default)
id_regex: "(FR|NFR|AC|US)-[A-Z][A-Z0-9]{1,5}-[0-9]{2,}[a-z]?"

# How coverage annotations appear in source
covers_regex: "@covers[[:space:]]+.*"

# The task-side mark.
carries_regex: "\*\*(Carries|Traces)\*\*:"

# How AC IDs appear inside test names (e.g. test_AC_DOCS_10_...)
test_ac_regex: "AC_[A-Z][A-Z0-9]{1,5}_[0-9]{2,}[a-z]?"
