# SpecAssay Check (Gate 2) config for the specassay repo's own registry.
# Founded 2026-08-18 by the docs room (design-room ruling): the tool now
# dogfoods itself. Scoped as founding, not backfill — see PRD.md's intro
# and specs/backlog/tasks.md for why every row opens as backlog.

# Authoritative ID registry
registry: "PRD.md"

# Display name in the emitted trace-manifest
target_name: "specassay"

# Where the check writes the trace-manifest (relative to the project root)
manifest_path: "trace-manifest.json"

# Spec Kit feature artifacts (globs relative to project root)
specs: "specs/**/spec.md"
tasks: "specs/**/tasks.md"

# What "source" means for this repo's own registry: the extension/preset
# code the tool ships, its own config, and (as of FR-GATE-40) the
# documentation the DOCS room is building. docs/**, README.md, and
# PROMOTION-CONTRACT.md were excluded during founding (2026-08-18):
# docs/testing/*.md quotes real @covers lines from other projects' trials
# as teaching examples, and orphan-covers had no domain-scoping to tell a
# citation apart from a real local claim (docs/docs-gaps.md). FR-GATE-40
# fixed the engine (domain-scoping + code-span/fence stripping); this line
# is that fix's own build, restoring docs/** here as promised.
# @covers FR-DOCS-50
src_globs:
  - "extensions/**"
  - "presets/**"
  - "docs/**"
  - "README.md"
  - "PROMOTION-CONTRACT.md"
  - "specassay-check-config.yml"

# extensions/specassay-check/tests/ (2026-08-18): a real automated suite
# for check-traceability.sh itself, exercising the core Gate rules plus
# regression coverage for FR-GATE-40 and FR-GATE-50. Test names that carry
# an AC's own ID (test_AC_GATE_40_..., test_AC_GATE_41_..., etc.) are that
# AC's real proof, not a self-report -- Rule 6a applies to this registry's
# own rows exactly as it does to every other project's.
test_globs:
  - "tests/**"
  - "extensions/specassay-check/tests/**"

# ID grammar (HomesFlow-compatible default)
id_regex: "(FR|NFR|AC|US)-[A-Z][A-Z0-9]{1,5}-[0-9]{2,}[a-z]?"

# How coverage annotations appear in source
covers_regex: "@covers[[:space:]]+.*"

# The task-side mark.
carries_regex: "\*\*(Carries|Traces)\*\*:"

# How AC IDs appear inside test names (e.g. test_AC_DOCS_10_...)
test_ac_regex: "AC_[A-Z][A-Z0-9]{1,5}_[0-9]{2,}[a-z]?"
