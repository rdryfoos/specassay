# SpecAssay Check (Gate 2) config for the example-app project.

# Authoritative ID registry (the PRD)
registry: "PRD.md"

# Display name in the emitted trace-manifest
target_name: "example-app"

# Where the check writes the trace-manifest (relative to the project root)
manifest_path: "trace-manifest.json"

# Spec Kit feature artifacts (globs relative to project root)
specs: "specs/**/spec.md"
tasks: "specs/**/tasks.md"

# Implementation + test trees
src_globs:
  - "src/**"
test_globs:
  - "tests/**"

# ID grammar (HomesFlow-compatible default)
id_regex: "(FR|NFR|AC|US)-[A-Z][A-Z0-9]{1,5}-[0-9]{2,}[a-z]?"

# How coverage annotations appear in source
covers_regex: "@covers[[:space:]]+.*"

# The task-side mark. Accepts both **Carries**: (new) and **Traces**: (pre-rename).
carries_regex: "\*\*(Carries|Traces)\*\*:"

# How AC IDs appear inside test names (e.g. test_AC_SYNC_01_...)
test_ac_regex: "AC_[A-Z][A-Z0-9]{1,5}_[0-9]{2,}[a-z]?"

# Thread Report: the affirm ceremony on the off-thread list.
#   off      — pure illuminate: the list is shown, no tick (default)
#   record   — a "these untraced changes are incidental" tick, informational
#   required — a human must tick before merge (wire the block in a separate step)
offthread_ack: "off"

# Thread Report: the affirm ceremony on restated intents (the Intent Changed
# section). Same three settings — off illuminates, record adds an informational
# tick, required makes a human confirm each restated intent still holds before
# merge. Only appears when a PR actually restates an intent.
intent_ack: "off"
