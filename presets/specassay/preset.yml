schema_version: "1.0"

preset:
  id: "specassay"
  name: "SpecAssay"
  version: "0.5.6"
  description: "Appends durable-ID, Carries, and SpecAssay vocabulary onto Spec Kit spec, tasks, and constitution templates."
  author: "Rik Dryfoos"
  license: "MIT"
  homepage: "https://www.specassay.com"
  repository: "https://github.com/rdryfoos/specassay"

requires:
  speckit_version: ">=0.14.0,<2.0.0"

  # The templates below name `speckit.specassay-check.gate`, and only the
  # specassay-check extension provides it. Declared so that installing this
  # preset on its own says what is missing instead of reading as complete:
  # Spec Kit prints the unmet dependency and the command that fixes it after
  # the install, and never fails the install over it. Spec Kit 1.0.4 and later
  # read this key; earlier releases, 1.0.3 and 0.14.0 among them, validate only
  # requires.speckit_version and ignore it, so declaring it costs them nothing.
  # @covers FR-COLD-10, AC-COLD-10a
  extensions:
    - id: "specassay-check"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Require inherited durable IDs and a risk table traced to FR/AC IDs"
      strategy: "append"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Require Carries: on every task"
      strategy: "append"

    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Append End-to-End Traceability article and SpecAssay vocabulary"
      strategy: "append"

tags:
  - "traceability"
  - "durable-ids"
  - "governance"
  - "sdd"
