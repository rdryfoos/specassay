name: Self Gate

# The docs room's dogfooding pass (2026-08-18, design-room ruling): specassay
# now gates its own registry (PRD.md) the same way it gates any adopter's.
# Founding pass — every row opens as anointed backlog, so a green run here
# means zero GAP and zero drift, not zero unfinished work.

on:
  push:
    branches: [main]
  # No path filter. Every pull request runs this, whatever it touches.
  #
  # There was a filter, and it was a list of the paths somebody had thought of.
  # It was added on 2026-09-15 to close docs/docs-gaps.md item 10, where a
  # docs-only pull request showed green checks at review time and was gated only
  # after merge by the unfiltered push trigger above. That fix named the four
  # documents that existed then. Three more were born afterwards
  # (FIRST-LIGHT.md, FIRST-LIGHT-NOTES.md, CASE-TEMPLATE.md), each joined the
  # version checker's governed set, and none joined this list. So on 2026-09-18
  # a pull request touching only FIRST-LIGHT.md produced no checks at all: not a
  # red check, no checks, which a reviewer reads as "none required" rather than
  # "none ran".
  #
  # The same defect twice, from the same cause: a list a human has to remember.
  # So the list is deleted rather than extended a second time. An empty check
  # list on a pull request should be impossible to produce.
  #
  # The cost was measured before this was done, not assumed: fourteen real runs
  # of this workflow span 23 to 35 seconds, median 28, which bills one minute
  # each, and this repository is public, so Actions minutes are free. If that
  # ever stops being true, the answer is to make the job cheaper, not to make it
  # run less often: a check that skips the change in front of it is not cheaper,
  # it is absent.
  pull_request:

jobs:
  self-gate:
    # Two runners, because one was not enough. 0.5.4 shipped a construct macOS's
    # system bash (3.2.57, the only bash on a stock Mac) cannot parse: the Gate ran
    # nothing on every Mac for a release, and this workflow was green throughout,
    # because it only ever ran on Linux bash 5. A checker whose own CI cannot see
    # the platform its users are on is a checker with a blind spot the size of
    # macOS. FR-GATE-200.
    #
    # The macOS job runs every step the Linux job runs, so a failure is read the
    # same way on either, plus one step the Linux job cannot have: the system
    # bash's own parse of every shipped script, named by absolute path, since
    # `bash` in PATH on a GitHub macOS runner is Homebrew's 5.x and an adopter's
    # Mac has 3.2 at /bin/bash.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Which bash this runner has, and whether the scripts parse under it
        # First, because everything after it is worthless if the answer is no, and
        # because the version belongs in the log of every run: the Mac Mini report
        # had to work out by hand which bash it was.
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          echo "---"
          for f in extensions/specassay-check/scripts/*.sh; do
            /bin/bash -n "$f" && echo "ok   $f" || { echo "FAIL $f"; exit 1; }
          done

      - name: The cold path, performed end to end
        # Named as its own step, not because the suite below would miss it, but
        # because this is the one test whose failure means a stranger cannot get
        # started. A reviewer should see that by name in the run rather than as one
        # dot among a hundred and seventy. FR-COLD-40.
        run: |
          set -euo pipefail
          # macOS runners ship a PEP 668 "externally managed" Python, which
          # refuses a plain install; the fallback is for that runner only and is
          # harmless on Linux, where the first command succeeds.
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest extensions/specassay-check/tests/test_cold_path_end_to_end.py -q

      - name: Extension test suite — check-traceability.sh
        run: |
          set -euo pipefail
          # macOS runners ship a PEP 668 "externally managed" Python, which
          # refuses a plain install; the fallback is for that runner only and is
          # harmless on Linux, where the first command succeeds.
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest extensions/specassay-check/tests/ tests/ -q
      - name: Docs state which kind of claim each version number is
        run: |
          set -euo pipefail
          python3 scripts/check-doc-versions.py
      - name: Gate 2 — this repo's own registry
        run: |
          set -euo pipefail
          SPECASSAY_PROJECT_ROOT="$PWD" \
          SPECASSAY_CONFIG="$PWD/specassay-check-config.yml" \
            bash extensions/specassay-check/scripts/check-traceability.sh
