name: Self Gate

# The docs room's dogfooding pass (2026-08-18, design-room ruling): specassay
# now gates its own registry (PRD.md) the same way it gates any adopter's.
# Founding pass — every row opens as anointed backlog, so a green run here
# means zero GAP and zero drift, not zero unfinished work.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "PRD.md"
      - "specs/**"
      - "extensions/specassay-check/**"
      - "presets/specassay/**"
      - "specassay-check-config.yml"
      # The documentation this registry governs. These four are in
      # specassay-check-config.yml's own src_globs, so a change to any of them
      # can orphan a @covers mark or drop a row's last carrier -- a refusal the
      # Gate would find. Until 2026-09-15 they were absent here, so a docs-only
      # PR showed green checks at review time and was gated only after merge,
      # by the unfiltered push trigger. Found on PR #7, which got no Gate run
      # of its own for exactly this reason (docs/docs-gaps.md, item 10).
      - "README.md"
      - "ONBOARD.md"
      - "docs/**"
      - "PROMOTION-CONTRACT.md"

jobs:
  self-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension test suite — check-traceability.sh
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest extensions/specassay-check/tests/ -q
      - name: Gate 2 — this repo's own registry
        run: |
          set -euo pipefail
          SPECASSAY_PROJECT_ROOT="$PWD" \
          SPECASSAY_CONFIG="$PWD/specassay-check-config.yml" \
            bash extensions/specassay-check/scripts/check-traceability.sh
