# SpecAssay Check config (edit after install)

# Authoritative ID registry (usually the PRD)
registry: "PRD.md"

# Optional display name in the trace-manifest (defaults to project directory name)
target_name: ""

# Where the check writes the trace-manifest (SpecAssay native matrix; format: trace-manifest)
manifest_path: "trace-manifest.json"

# Spec Kit feature artifacts (globs relative to project root)
specs: "specs/**/spec.md"
tasks: "specs/**/tasks.md"

# Implementation + test trees (adjust per language/layout)
src_globs:
  - "src/**"
  - "ios/**/*.swift"
test_globs:
  - "tests/**"
  - "ios/**/*Tests*/**/*.swift"

# ID grammar (HomesFlow-compatible default)
id_regex: "(FR|NFR|AC|US)-[A-Z][A-Z0-9]{1,5}-[0-9]{2,}[a-z]?"

# How coverage annotations appear in source
covers_regex: "@covers[[:space:]]+.*"

# The task-side mark. Accepts both **Carries**: (new) and **Traces**: (pre-rename) during transition.
carries_regex: "\*\*(Carries|Traces)\*\*:"

# Rule 6a / FR-GATE-30: the only way an ID reaches "retired" -- there is no
# settable status field. Shape: **Retires**: <id-list> (<YYYY-MM-DD>): <reason>
# on an open task, e.g.:
#   **Retires**: AC-CLEW-01, FR-CLEW-01 (2026-08-18): cold-agent probe
#   concluded; tooling archived at tag clew-era-final.
# Malformed records (no ID before the date, or no "(YYYY-MM-DD): reason")
# refuse loudly before any scanning, same as a malformed src_globs/test_globs.
retires_regex: "\*\*Retires\*\*:"

# How AC IDs appear inside test names (e.g. test_AC_SYNC_04_...)
test_ac_regex: "AC_[A-Z][A-Z0-9]{1,5}_[0-9]{2,}[a-z]?"

# FR-GATE-10 / FR-GATE-20: --matrix and --portfolio output paths.
# --matrix writes matrix_md + matrix_svg (CI/PR-oriented: a summary table,
# a GENERATED FILE banner). --portfolio writes portfolio_md (narrative,
# cold-reader-oriented: zero prior context assumed, no CI banner) and
# shares the same matrix_svg image rather than rendering a second one.
# All three default to the project root if omitted.
# matrix_md: "coverage.md"
# matrix_svg: "coverage.svg"
# portfolio_md: "portfolio-snapshot.md"

# FR-GATE-90: parent edges DERIVE from the registry document's own
# heading/section nesting at emit time -- never authored, never inferred
# by a viewer, never guessed from ID-prefix naming. "heading-nesting"
# reads indentation (markdown headings and/or indented list depth) to
# find each ID's nearest shallower ancestor ID; a flat registry (or this
# key left unset) emits no parent edges at all -- absence, not a guess.
# Rows with descendants also carry a composition rollup (status counts
# over the whole subtree, any depth). Additive/optional: works whether or
# not your registry nests IDs this way.
# parent_derivation: heading-nesting

# Rule 4a (PROMOTION-CONTRACT.md): uncovered-proof (an ID with a real,
# passing test but no file's @covers line names it) is report-only by
# default -- it never fails the Gate on its own, only appears under
# gate.diagnostics[]. Flip to blocking only once this project's own
# backlog is actually clear (a real, verified zero, not assumed), and
# record the date and reason as a comment on this line -- the flip
# itself should be traceable, not a silent behavior change.
# block_uncovered_proof: true

# Rule 6a (PROMOTION-CONTRACT.md): path to a JUnit XML test-results
# report from this project's own test run (pytest --junit-xml=...,
# node:test's junit reporter, vitest's junit reporter -- all already
# produce this format). When set, "proven" requires a *passing*
# testcase, not just a matching name; when unset, the Gate falls back
# to name-matching alone and says so loudly (gate.executionVerified:
# false in the trace-manifest), never a silent, implied upgrade.
# test_results: "test-results.xml"
