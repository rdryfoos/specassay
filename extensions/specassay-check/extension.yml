schema_version: "1.0"

extension:
  id: "specassay-check"
  name: "SpecAssay Check"
  version: "0.5.6"
  description: "Gate 2 refuses silent gaps and emits a trace-manifest (`trace-manifest.json`)."
  category: "visibility"
  effect: "read-write"
  author: "Rik Dryfoos"
  license: "MIT"
  homepage: "https://www.specassay.com"
  repository: "https://github.com/rdryfoos/specassay"

requires:
  speckit_version: ">=0.14.0,<2.0.0"
  # The Gate is a shell script; the Thread Report is Python, standard library
  # only. 3.8 is the floor we support and test against (the code itself parses
  # on 3.7, so the constraint is deliberately conservative).
  #
  # bash 3.2 is the floor because that is macOS's system bash (3.2.57, Apple's
  # last GPLv2 release) and the only bash on a stock Mac. It said "bash" with no
  # version until 0.5.5, and what nobody wrote down nobody tested: 0.5.4 shipped
  # a here-document nested in a command substitution, which 3.2 cannot parse, and
  # the Gate ran nothing on every Mac for one release. CI now runs the suite and
  # the cold path on a macOS runner against /bin/bash as well as on Linux.
  tools:
    - name: "bash"
      version: ">=3.2"
      required: true
    - name: "python3"
      version: ">=3.8"
      required: true

provides:
  commands:
    - name: "speckit.specassay-check.gate"
      file: "commands/speckit.specassay-check.gate.md"
      description: "Run SpecAssay Check / Gate 2 (silent gaps fail; write trace-manifest.json)"
    - name: "speckit.specassay-check.mint"
      file: "commands/speckit.specassay-check.mint.md"
      description: "Mint the next durable ID for a prefix and area, or resolve a duplicate-id refusal"
    - name: "speckit.specassay-check.dig"
      file: "commands/speckit.specassay-check.dig.md"
      description: "Archaeology mode (no-LLM floor): propose a first-pass candidate registry from an unfamiliar repo, written only to dig-report.json"
    - name: "speckit.specassay-check.matrix"
      file: "commands/speckit.specassay-check.matrix.md"
      description: "Regenerate coverage.md + coverage.svg (CI/PR-oriented) from the current registry/gate state"
    - name: "speckit.specassay-check.portfolio"
      file: "commands/speckit.specassay-check.portfolio.md"
      description: "Regenerate portfolio-snapshot.md (narrative, cold-reader-oriented) from the current registry/gate state"

  config:
    - name: "specassay-check-config.yml"
      template: "config-template.yml"
      description: "Registry path, source/test globs, and ID grammar"
      required: true

hooks:
  after_implement:
    command: "speckit.specassay-check.gate"
    optional: true
    prompt: "Run SpecAssay Check (Gate 2 traceability)?"
    description: "Refuse silent gaps after implementation; refresh trace-manifest.json"

tags:
  - "traceability"
  - "gate"
  - "ci"
  - "governance"
  - "sdd"
